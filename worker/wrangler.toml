# MCP Readiness: hosted scanner + landing page.
# Canonical host: https://mcp.pacerai.fit
# workers.dev stays up for the API, badges, GitHub Action, and /stats. See worker/README.md.
name = "mcp-readiness"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[routes]]
pattern = "mcp.pacerai.fit"
custom_domain = true

# Cron is defined here to match main, but it is NOT registered on this account:
# the Workers Free plan allows 5 cron triggers per account, and that cap is
# already used by existing workers we must not change. Do not upgrade to Paid.
# [triggers]
# crons = ["17 6 * * *"]   # daily monitoring re-scan (06:17 UTC)

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Create with: npx wrangler kv namespace create LICENSES  (then paste the id)
[[kv_namespaces]]
binding = "LICENSES"
id = "152ddf7a351547409d119ec351698d68"

[vars]
PUBLIC_URL = "https://mcp.pacerai.fit"
# One-line GSC HTML-tag hook. Leave empty until Omer pastes the token from his GSC account.
GOOGLE_SITE_VERIFICATION = ""
FREE_SCANS_PER_HOUR = "10"
PAGE_SCANS_PER_HOUR = "20"
PAGE_SCANS_GLOBAL_PER_HOUR = "30"
SCAN_TIMEOUT_MS = "12000"
# Payment Links / Lemon Squeezy checkout URLs (public, safe as vars):
CHECKOUT_URL_PRO = ""
CHECKOUT_URL_TEAM = ""
CHECKOUT_URL_VERIFIED = ""
CHECKOUT_URL_PACK = ""
CHECKOUT_URL_CREDITS = ""
FREE_ACTION_RUNS_PER_DAY = "50"
# Hook into the ToolSlim "fix" step (shown when context cost is high):
TOOLSLIM_URL = "https://github.com/Om3rr/toolslim"
# Plan mapping, JSON. Stripe: payment_link id -> plan. Lemon Squeezy: variant id -> plan.
STRIPE_PLAN_BY_LINK = "{}"
LEMON_PLAN_BY_VARIANT = "{}"

# Secrets (never in this file): set with `npx wrangler secret put NAME`
#   STRIPE_WEBHOOK_SECRET   whsec_... from the Stripe webhook endpoint
#   LEMON_WEBHOOK_SECRET    signing secret from Lemon Squeezy > Settings > Webhooks
#   CF_ACCOUNT_ID, CF_BROWSER_TOKEN   optional, enables PDF via Browser Rendering

# Shared free D1 for public /stats, events and the Pro waitlist (emails stored privately, never shown on /stats).
# Writes go through ctx.waitUntil and fail open. Same database as agent-ready-score.
[[d1_databases]]
binding = "METRICS"
database_name = "studio-metrics"
database_id = "3448df02-bdfb-4f45-8279-6dbf1ae9f83f"

# Workers Logs (Free plan: 200k events/day, 3-day retention). Invocation logs are
# off so request URLs, IPs and full user-agents are not persisted. Custom logs
# emit only target host, UA class and ASN. Do not enable traces (not needed).
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false
