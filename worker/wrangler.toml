# MCP Readiness: hosted scanner + landing page.
# Deploy: see worker/README.md. Nothing here is deployed yet.
name = "mcp-readiness"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["17 6 * * *"]   # daily monitoring re-scan (06:17 UTC)

[assets]
directory = "./public"
binding = "ASSETS"

# Create with: npx wrangler kv namespace create LICENSES  (then paste the id)
[[kv_namespaces]]
binding = "LICENSES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
PUBLIC_URL = "https://mcp-readiness.example.workers.dev"
FREE_SCANS_PER_HOUR = "10"
SCAN_TIMEOUT_MS = "12000"
# Payment Links / Lemon Squeezy checkout URLs (public, safe as vars):
# PLACEHOLDER stub until Omer picks Stripe or Lemon Squeezy. Pro is billed off-platform (no paid Marketplace plans for Actions).
CHECKOUT_URL_PRO = "https://buy.example.com/mcp-readiness-pro"
CHECKOUT_URL_TEAM = ""
CHECKOUT_URL_VERIFIED = ""
CHECKOUT_URL_PACK = ""
CHECKOUT_URL_CREDITS = ""
FREE_ACTION_RUNS_PER_DAY = "50"
# Hook into the ToolSlim "fix" step (shown when context cost is high):
TOOLSLIM_URL = "https://github.com/Om3rr/toolslim"
# Plan mapping, JSON. Stripe: payment_link id -> plan. Lemon Squeezy: variant id -> plan.
STRIPE_PLAN_BY_LINK = "{}"
LEMON_PLAN_BY_VARIANT = "{}"

# Secrets (never in this file): set with `npx wrangler secret put NAME`
#   STRIPE_WEBHOOK_SECRET   whsec_... from the Stripe webhook endpoint
#   LEMON_WEBHOOK_SECRET    signing secret from Lemon Squeezy > Settings > Webhooks
#   CF_ACCOUNT_ID, CF_BROWSER_TOKEN   optional, enables PDF via Browser Rendering
